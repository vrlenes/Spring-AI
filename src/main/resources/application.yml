spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: belediye-ai-asistan

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/belediye_asistan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    # Tamamen yerel calisiyor: Ollama, hem chat hem embedding icin. Ucretsiz,
    # veri disari cikmiyor (KVKK), dokumanin Faz 5 hedefi burada erkene cekildi.
    # Farkli bir saglayiciya gecmek istersen sadece bu blogu degistirmen yeterli -
    # ChatClientConfig.java ve digerlerinde hicbir Java kodu degismez.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen2.5:7b}
          temperature: 0.2
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

asistan:
  rag:
    # Spring AI 1.1.x'teki TokenTextSplitter'da ayri bir "overlap" parametresi yok
    # (chunk-size + min-chunk-size-chars ile calisiyor), o yuzden dokumandaki
    # chunk-overlap ayari burada yer almiyor.
    chunk-size: 800
    top-k: 5
    similarity-threshold: 0.65
  chat:
    memory-window: 20
  llm:
    # Yerel Ollama modeli tek bir GPU/CPU kaynagini paylasiyor - ayni anda
    # islenebilecek LLM istegi sayisini sinirlar (bkz. LlmEsZamanliSinirlayici).
    es-zamanli-istek-siniri: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: belediye-ai-asistan

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/belediye_asistan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    # Chat: bulut (Google GenAI / Gemini, ucretsiz AI Studio kotasi). Embedding:
    # yerel Ollama (bge-m3) - RAG'de kullanilan pgvector koleksiyonu bu modelin
    # boyutuna (1024) gore olusturuldugu icin embedding tarafi degismedi, sadece
    # chat saglayicisi degisti. Google'in bulut embedding API'sine (gemini-
    # embedding-001) gecis denendi ama ucretsiz katmanin embedding icin hiz
    # siniri cok dusuk (5 RPM) ve ucretli katmana gecis icin zorunlu minimum
    # on odeme (~500 TL) bu projenin gercek ihtiyacina (bir kerelik ~285K
    # token, birkaç sent) kiyasla orantisiz bulundu - bge-m3'e geri donuldu
    # (bkz. git gecmisi). Bu proje gercek vatandas verisi ISLEMIYOR (mock/
    # staj verisi) - KVKK gerekcesiyle daha once Ollama'da kalinmisti (bkz. git
    # gecmisi), ama gercek kisisel veri olmadigi icin bulut sohbet modeline
    # gecmek burada bir sorun degil. Ayni gerekce gercek vatandas verisiyle
    # calisan bir kuruma tasinirsa GECERSIZ olur, o zaman tekrar yerel/KVKK-
    # uyumlu bir saglayiciya donulmesi gerekir.
    model:
      chat: google-genai
      embedding: ollama
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: ${AI_CHAT_MODEL:gemini-3.5-flash-lite}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE

# Kurum dizini (mudurluk iletisim + personel dizini, bkz. kurum paketi ve
# config/KurumDizinDataSourceConfig) - AYRI bir veritabani, ana uygulama
# DB'sinden (spring.datasource) bagimsiz. Ayni Postgres sunucusu, farkli DB
# adi - ayni ortam degiskenleri (DB_USER/DB_PASSWORD) tekrar kullanilir.
kurum:
  datasource:
    url: ${KURUM_DB_URL:jdbc:postgresql://localhost:5433/kurum_dizini}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

asistan:
  rag:
    # Spring AI 1.1.x'teki TokenTextSplitter'da ayri bir "overlap" parametresi yok
    # (chunk-size + min-chunk-size-chars ile calisiyor), o yuzden dokumandaki
    # chunk-overlap ayari burada yer almiyor.
    chunk-size: 800
    # 5 idi: belge sayisi 5'ten 13'e cikinca canli testte bir sorun
    # bulundu - konuyla ilgili birden fazla belge varsa (orn. "gurultu
    # sikayetine zabita ne yapar" sorusu hem Gurultu Yonetmeligi hem Zabita
    # Yonetmeligi hem Kabahatler Kanunu'nu ilgilendiriyor), tek bir belgenin
    # 5 parcasi ust-k'nin TAMAMINI doldurup diger belgelerden hic kaynak
    # gelmemesine yol acabiliyordu. 8'e cikarildi - LLM zaten belgeAra
    # aracindan donen metni okuyup alakasizi kendisi eliyor (esik burada
    # sadece gurultuyu elemek icin, bkz. asagidaki not), o yuzden daha
    # fazla ham sonuc vermek risksiz.
    top-k: 8
    # 0.65 idi: canli testte gercek/alakali chunk'larin skoru 0.54-0.67 araliginda
    # cikiyor (bge-m3 + Turkce mevzuat metni icin), yani eski esik gercek eslesmeleri
    # de eliyordu (RUHSAT modunda dogrulandi: esik 0'a cekilince 5 alakali chunk
    # 0.54-0.58 araliginda goruldu). Nihai relevans kontrolu zaten LLM'in belgeAra
    # aracindan donen gercek metni okuyup degerlendirmesiyle yapiliyor - esik burada
    # sadece belirgin gurultuyu elemek icin var, o yuzden dusuk tutuluyor.
    similarity-threshold: 0.3
  chat:
    memory-window: 20
  llm:
    # Yerel Ollama modeli (embedding) tek bir GPU/CPU kaynagini paylasiyor -
    # ayni anda islenebilecek LLM istegi sayisini sinirlar (bkz.
    # LlmEsZamanliSinirlayici).
    es-zamanli-istek-siniri: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

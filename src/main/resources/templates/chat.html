<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Belediye AI Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-slate-100 flex flex-col">

<header class="bg-slate-800 text-white px-4 py-3 flex items-center justify-between">
    <h1 class="text-lg font-semibold">Karatay Belediyesi AI Asistanı</h1>
    <button id="yeniKonusma" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded">
        Yeni Konuşma
    </button>
</header>

<main id="mesajlar" class="flex-1 overflow-y-auto p-4 space-y-3 max-w-3xl w-full mx-auto"></main>

<footer class="border-t bg-white p-3">
    <form id="mesajForm" class="max-w-3xl mx-auto flex gap-2">
        <input id="mesajInput" type="text" autocomplete="off" placeholder="Bir soru yazın..."
               class="flex-1 border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400"/>
        <button type="submit"
                class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded disabled:opacity-50"
                id="gonderButon">
            Gönder
        </button>
    </form>
</footer>

<script src="/js/chat.js"></script>
</body>
</html>

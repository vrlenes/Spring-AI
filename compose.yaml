services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: belediye_asistan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Sadece TAZE bir pgdata volume'de ilk baslatmada calisir (Postgres'in
      # kendi davranisi) - kurum_dizini adinda ikinci, ayri bir veritabani
      # olusturur (mudurluk iletisim + personel dizini icin, bkz. kurum
      # paketi). Zaten initialize olmus mevcut gelistirme ortaminda bu script
      # calismaz - orada DB elle olusturulmustu.
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # rag_arama_logu tablosunu (bkz. RagAramaLoguService) gorsellestirmek icin -
  # Postgres'e dogrudan bagli, hazir bir dashboard'la gelir (provisioning,
  # bkz. docker/grafana/). Uygulama kodunu etkilemez, salt-okunur bir
  # gozlemlenebilirlik katmani.
  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
